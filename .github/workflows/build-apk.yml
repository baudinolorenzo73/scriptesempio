# Compila l'APK ad ogni push (o a mano: Actions -> Build APK -> Run workflow)
# e lo pubblica nelle Releases del repository.  Generato da Crea APK · by Lollo ®2026
name: Build APK

on:
  push:
    paths-ignore:
      - "firma/**"
      - "README.md"
      - "LEGGIMI.md"
  workflow_dispatch:

permissions:
  contents: write

# Una nuova pubblicazione annulla la compilazione precedente ancora in corso
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Installa Capacitor
        run: npm install --no-audit --no-fund

      - name: Chiave di firma stabile
        # Senza una chiave fissa ogni APK avrebbe una firma diversa e Android
        # rifiuterebbe di installarlo sopra la versione precedente.
        run: |
          mkdir -p ~/.android
          if [ -f firma/debug.keystore ]; then
            cp firma/debug.keystore ~/.android/debug.keystore
            echo "Chiave di firma esistente riutilizzata"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p firma
            cp ~/.android/debug.keystore firma/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add firma/debug.keystore
            git commit -m "Chiave di firma per gli aggiornamenti [skip ci]"
            git push || echo "ATTENZIONE: chiave non salvata nel repository, il prossimo APK avrà una firma diversa"
          fi

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Copia le pagine e i plugin nell'app
        run: npx cap sync android

      - name: Prepara nome, versione, permessi, icona e download
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: node cap-prepara.js

      - name: Compila APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Raccogli APK
        run: |
          mkdir -p bin
          cp android/app/build/outputs/apk/debug/app-debug.apk bin/scriptesempio-debug.apk

      - name: Salva APK tra gli artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Pubblica APK nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: Compilato automaticamente dal commit ${{ github.sha }}
          files: bin/*.apk
